name: Build AI Design Studio APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project root
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          test -f settings.gradle || (echo "ERROR: settings.gradle must be in repository root" && find . -maxdepth 4 -name settings.gradle -print && exit 1)
          test -f build.gradle
          test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: |
            platform-tools

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platform-tools"

      - name: Build Debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Design-Studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: AI Design Studio - Debug Build #${{ github.run_number }}
          body: |
            ## AI Design Studio APK

            Automated Android Debug APK build.

            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
